<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Atividade</title>

    <script>
        var hora = Number(prompt("Informe a hora:"))
        if (hora >= 6 && hora <= 11) {
            alert("Bom dia!")
        }
        else if (hora >= 12 && hora <= 18) {
            alert("Bom tarde!")
        }
        else if (hora >= 19 && hora <= 23) {
            alert("Boa noite!")
        }
        else if (hora >= 0 && hora <= 5) {
            alert("Boa madrugada!")
        }
        else {
            alert("Hora inválida!")
        }
    </script>
    
</head>
<body>
    
</body>
</html>
