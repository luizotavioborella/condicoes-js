<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Atividade</title>

    <script>
        var peso = Number(prompt("Informe seu peso:"))
        var altura = Number(prompt("Informe sua altura (ex: 1.70):"))
        imc = peso / (altura ** 2)
        if (imc <= 18.4) {
            alert("Magreza")
        }
        else if (imc >= 18.5 && imc <= 24.9) {
            alert("Peso adequado")
        }
        else if (imc >= 25 && imc <= 29.9) {
            alert("Sobrepeso")
        } else {
            alert("Obesidade")
        }
    </script>
    
</head>
<body>
    
</body>
</html>
