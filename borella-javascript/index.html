    <script>
        var num = Number(prompt("Informe um número:"))
        var num2 = Number(prompt("Informe outro número:"))

            alert(num + " é maior que " + num2)
        }
        else if (num2 > num) {
            alert(num2 + " é maior que " + num)

            alert("Os números são iguais")
        } 
    </script>
