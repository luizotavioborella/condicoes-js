<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Atividade</title>

    <script>
        var num = Number(prompt("Informe um número:"))
        if (num > 0) {
            alert("O número é positivo")
        } else if (num < 0) {
            alert("O número é negativo")
        } else {
            alert("O número é 0")
        }
    </script>
    
</head>

</body>
</html>
