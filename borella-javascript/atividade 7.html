<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Atividade</title>

    <script>
        var dia = Number(prompt("Digite um número de 1 a 7:"))
        if (dia == 1) {
            alert("Domingo")
        }
        else if (dia == 2) {
            alert("Segunda")
        }
        else if (dia == 3) {
            alert("Terça")
        }
        else if (dia == 4) {
            alert("Quarta")
        }
        else if (dia == 5) {
            alert("Quinta")
        }
        else if (dia == 6) {
            alert("Sexta")
        }
        else if (dia == 7) {
            alert("Sábado")
        }
        else {
            alert("Número inválido")
        }
    </script>
    
</head>
<body>
    
</body>
</html>
