<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Atividade</title>

    <script>
        var ano = Number(prompt("Informe o ano:"))
        if (ano % 4 == 0) {
            if (ano % 400 == 0 || ano % 100 != 0) {
                alert(ano + " é bissexto")
            }
            else {
                alert(ano + " não é bissexto")
            }
        }
        else {
            alert(ano + " não é bissexto")
        }
    </script>
    
</head>

</body>
</html>
