<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Atividade</title>

    <script>
        var num1 = Number(prompt("Informe um número:"))
        var num2 = Number(prompt("Informe outro número:"))
        var num3 = Number(prompt("Informe outro número:"))
        if (num1 > num2 && num3 < num1) {
            alert(num1 + " é maior que " + num2 + " e " + num3)
        }
        else if (num2 > num1 && num3 < num2) {
            alert(num2 + " é maior que " + num1 + " e " + num3)
        }   
        else if (num3 > num1 && num2 < num3) {
            alert(num3 + " é maior que " + num2 + " e " + num1)
        } else {
            alert("Números iguais")
        }
    </script>
    
</head>

</html>
